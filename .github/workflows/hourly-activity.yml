name: Refresh Hourly Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-hourly-activity
  cancel-in-progress: false

jobs:
  habits:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub coding-habits chart
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Velord
          base: ""
          template: classic
          filename: assets/activity-by-hour.svg
          output_action: commit
          committer_branch: main
          committer_message: "Update: hourly GitHub activity [skip ci]"
          config_display: large
          config_timezone: Europe/Kyiv
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_languages_limit: 0
