name: Refresh Hourly Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-hourly-activity
  cancel-in-progress: false

jobs:
  hourly-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate hourly public commit activity
        run: node .github/scripts/update_activity_hours.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit hourly chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-by-hour.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update: hourly public commit activity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
