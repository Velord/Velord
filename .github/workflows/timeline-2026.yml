name: Refresh 2026 Timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-timeline-2026
  cancel-in-progress: false

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh 2026 contribution chart
        run: node .github/scripts/update_timeline.cjs
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/timeline-2026.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update: 2026 contribution timeline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
