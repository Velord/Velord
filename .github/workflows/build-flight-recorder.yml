name: Refresh Build Flight Recorder

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * *"

permissions:
  contents: write

concurrency:
  group: profile-build-flight-recorder
  cancel-in-progress: false

jobs:
  build-flight-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch public HorizonBloom verification history
        run: node .github/scripts/update_build_flight_recorder.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/build-flight-recorder.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update: Build Flight Recorder history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
