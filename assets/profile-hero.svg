<text x="42" y="211" fill="#f1f4fa" font-family="'Segoe UI',Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-3.5">Yaroshenko<tspan fill="#e8bc98">.</tspan></text>
<text x="45" y="251" fill="#c3cedd" font-family="'Segoe UI',Arial,sans-serif" font-size="20">Android · Kotlin Multiplatform · Compose</text>
