<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">Vlad Yaroshenko — Android and Kotlin Multiplatform Engineer</title>
<desc id="desc">Minimal dark navy engineering portfolio header, luminous sunrise arc, refined typography and a three-part engineering focus footer.</desc>
<defs>
